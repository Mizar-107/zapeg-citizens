plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "zapeg-citizens-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Exploded ForgeGradle source sets have no jar manifest, so register the
            // required config through Mixin's supported development command line.
            args '--mixin', 'zapeg_citizens.mixins.json'
            // The published Numen jar carries an SRG production refmap, while ForgeGradle's
            // userdev runtime uses official names. Numen's own 1.20.1 run configs use this
            // same dev-only switch; production must keep the refmap enabled.
            property 'mixin.env.disableRefMap', 'true'

            mods {
                zapeg_citizens {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            // Normal production servers do not load GameTests. Disable them in userdev too:
            // the published, re-mapped Numen jar retains Mojmap annotation element names that
            // ForgeGradle cannot reconstruct while reflecting its bundled test fixtures.
            property 'forge.enableGameTest', 'false'
            args '--nogui'
        }
    }
}

repositories {
    maven {
        name = 'Numen public Maven'
        url = 'https://raw.githubusercontent.com/Dwinovo/numen-maven/main'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

configurations {
    pinnedNumen {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Numen's released Forge jar supplies this API at runtime. The exact beta API is
    // intentionally pinned because the lifecycle adapter currently uses two @Internal classes.
    compileOnly fg.deobf("com.dwinovo.numen:numen-api-forge-1.20.1:${numen_api_version}") {
        transitive = false
    }
    runtimeOnly fg.deobf("curse.maven:numen-ai-1581109:${numen_curseforge_file_id}") {
        transitive = false
    }
    pinnedNumen "com.dwinovo.numen:numen-api-forge-1.20.1:${numen_api_version}"
    pinnedNumen "curse.maven:numen-ai-1581109:${numen_curseforge_file_id}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.register('verifyPinnedNumen') {
    inputs.files(configurations.pinnedNumen)
    doLast {
        def expected = [
                "com.dwinovo.numen:numen-api-forge-1.20.1:${numen_api_version}":
                        numen_api_sha256.toLowerCase(Locale.ROOT),
                "curse.maven:numen-ai-1581109:${numen_curseforge_file_id}":
                        numen_sha256.toLowerCase(Locale.ROOT)
        ]
        def artifacts = configurations.pinnedNumen.resolvedConfiguration.resolvedArtifacts
        expected.each { coordinate, expectedHash ->
            def artifact = artifacts.find {
                "${it.moduleVersion.id.group}:${it.name}:${it.moduleVersion.id.version}" == coordinate
            }
            if (artifact == null) {
                throw new GradleException("Missing pinned dependency: ${coordinate}")
            }
            def actualHash = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(artifact.file.bytes).encodeHex().toString()
            if (actualHash != expectedHash) {
                throw new GradleException(
                        "Checksum mismatch for ${coordinate}: expected ${expectedHash}, got ${actualHash}")
            }
        }
    }
}

tasks.named('compileJava').configure {
    dependsOn 'verifyPinnedNumen'
}

tasks.withType(JavaExec).configureEach {
    if (name == 'runServer') {
        // Keep the development server console usable for command-level smoke tests.
        standardInput = System.in
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            forge_version: forge_version,
            numen_version: numen_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'          : 'zapeg_citizens.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifact sourcesJar
        }
    }
    repositories {
        maven {
            url = layout.buildDirectory.dir('repo')
        }
    }
}
